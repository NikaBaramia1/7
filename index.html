<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Service</th>
          <th>Gender</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th rowspan="2">Haircut</th>
          <td>Men</td>
          <td>30</td>
        </tr>
        <tr>
          <td>Women</td>
          <td>100</td>
        </tr>
        
        <tr>
          <th rowspan="2">Beard</th>
          <td>Men</td>
          <td>50</td>
        </tr>
        <tr>
            <td>Women</td>
            <td>60</td>
        </tr>


        <tr>
          <th rowspan="2">Combo</th>
          <td>Men</td>
          <td>65</td>
        </tr>
        <tr>
            <td>Women</td>
            <td>BANNED</td>
        </tr>
      </tbody>
      <tfoot>
          <tr>
            <th rowspan="2" colspan="3">Prices include VAT</th>
          </tr>
      </tfoot>
    </table>
  </body>
</html>
